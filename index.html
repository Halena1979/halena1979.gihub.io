<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Originals by Halena</title>

    <!-- Cache Busting Tags: Forces modern browser apps to fetch fresh code layouts immediately -->
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">

    <style>
        :root {color-scheme:only light;}
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Stops mobile layouts from jumping during window flips */
        }
	
        /* 1. Outer viewport window wrapper that centers our graphic artwork structure */
        .page-wrapper {
            position: relative; 
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
            
            /* Thinner, clean grey border edge buffer layout zone */
            padding: 8px; 
            box-sizing: border-box; 
        }

        /* 2. THE CANVAS: Dynamically maps the dimensions of whichever image is loading */
        .artwork-canvas {
            position: relative; 
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            
            /* Default narrow aspect ratio logic locks the absolute bounds mapping safely */
            aspect-ratio: 1080 / 1920;
        }

        /* 3. The true background graphic layer player engine setup */
        .canvas-bg-img {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* Fills our aspect container box perfectly with zero trailing edges */
            z-index: 1;
        }

        /* WIDESCREEN ASPECT FLIP: Changes the container shape when screen is wide or turned landscape */
        @media (min-width: 901px), screen and (orientation: landscape) {
            .artwork-canvas {
                /* Flip the bounding aspect frame to match the desktop widescreen dimensions */
                aspect-ratio: 1920 / 1080;
            }
        }

        /* ========================================================
           COORDINATE GRID TUNING KEYS
           All percentages below track the raw image bounds natively
           ======================================================== */

        /* 1. DEFAULT MOBILE NARROW VIEW (Portrait Phone) */
        #dropdown-anchor {
            position: absolute;
            z-index: 100; /* Keeps dropdown layers positioned safely ABOVE the background image */  
            transform: translate(-50%, -50%);
            
            /* Pin the center point directly over the mobile black menu rectangle */
            --base-top: 3.65%;
            --base-left: 14%;
            top: var(--base-top);
            left: var(--base-left);
            width: 26%;  
            height: 5%; 
            
            container-type: inline-size;
            white-space: nowrap;

            
        }

        /* 2. Dynamic aspect ratio adjustment for wider/shorter mobile screens (like 19.5:9) */
            @media screen and (orientation: portrait) and (max-width: 480px) {
                #dropdown-anchor {
                    /* The image scales up to fill the horizontal width, which pushes the layout downward. 
                    We use the scaling factor difference to shift the element down and adjust left positioning. */
                    top: calc(var(--base-top) + 0.1dvh); 
                    left: calc(var(--base-left) + 0.5dvw);
                } }

        .iframe-container {
            position: absolute;
            z-index: 10; 
            transform: translate(-50%, -50%);
            left: 50%;
            
            /* Pushes up safely to clear your portrait bottom border lines */
            top: 48.5%;          
            width: 98%;        
            height: 84%;       
        }

        /* 2. MOBILE LANDSCAPE OVERRIDE (Phones rotated sideways only) */
        @media screen and (orientation: landscape) and (max-width: 900px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 10.5%;  /* Center point over the landscape black menu box */
                top: 8.7%;   
                width: 32%;   
                height: 6%; 
            }

            .iframe-container {
                top: 51.5%;        
                width: 92%;        
                height: 58%;       
            }
        }

        /* 3. TRUE DESKTOP VIEW OVERRIDE (Large monitors & tablets) */
        @media screen and (min-width: 901px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 7.25%;  /* Center point over the widescreen desktop menu box */
                top: 9.9%;    
                width: 30%;   
                height: 6%; 
            }

            .iframe-container {
                top: 48.5%;        
                width: 90%;        
                height: 69%;       
            }
        }

        /* Reset inner frame systems */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none; 
            background: transparent; 
        }

        /* Ensure options text inside your native select element lists legibly */
        #dropdown-anchor select option {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-weight: normal !important;
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- The Balanced Coordinate Canvas Container Box -->
        <div class="artwork-canvas">
            
            <!-- Standard layout definition path prevents layout engine collapse bugs across all viewports -->
            <img id="bg-image-element" src="main_background_narrow.png" class="canvas-bg-img" alt="Background">

            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
            
        </div>

    </div>

    <!-- Clean Coupling Link to your External Shared Javascript Module File -->
    <script src="image_dropdown.js"></script>
    
    <script>
        // Automatic Image Source Engine Switcher
        function updateResponsiveImageSource() {
            const imgElement = document.getElementById('bg-image-element');
            if (!imgElement) return;

            // Check viewport metrics directly against our 901px CSS shift break point exactly
            const isWidescreen = window.innerWidth >= 901 || window.matchMedia("(orientation: landscape)").matches;
            const targetSrc = isWidescreen ? "main_background_wide.png" : "main_background_narrow.png";

            // Swap source file path only when necessary to save browser performance loops
            if (!imgElement.src.includes(targetSrc)) {
                imgElement.src = targetSrc;
            }
        }

        // Initialize viewport tracking engine links
        window.addEventListener('resize', updateResponsiveImageSource);
        window.addEventListener('DOMContentLoaded', () => {
            updateResponsiveImageSource();

            const pageMenuConfig = [
                { title: "ABOUT ME",  filename: "./about_me.html" },
                { title: "MY PROCESS",  filename: "./process.html" },
                { title: "PET PORTRAITS", filename: "./pet_portraits.html" },
                { title: "INK DRAWINGS",  filename: "./ink_drawings.html" }
            ];

            // Instantiates your separate external javascript object cleanly using the modified image parameters
            if (typeof ImageDropdown !== 'undefined') {
                new ImageDropdown('dropdown-anchor', 'main_frame', 'bg-image-element', pageMenuConfig, 'CHOOSE A PAGE...',  0, 0 );
            }
        });

       window.addEventListener('pageshow', (event) => {
    // Check if the page is being pulled straight from a frozen browser memory state
    if (event.persisted) {
        // Force-append a dynamic cache-busting timestamp parameter to break free from the bfcache
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set('t', Date.now());
        
        // Push a hard navigation routing assignment instead of a standard reload() command
        window.location.replace(currentUrl.toString());
    }
});

window.addEventListener('beforeunload', () => {
    // Turning off persistence ensures the next load starts from scratch
    if (window.performance && window.performance.navigation.type === 1) {
        // Soft-clear session history states if the user triggered a reload
        window.name = ""; 
    }
});

 window.addEventListener('DOMContentLoaded', () => {
            const navEntries = window.performance?.getEntriesByType("navigation");
            const isReload = navEntries ? navEntries[0]?.type === "reload" : window.performance?.navigation?.type === 1;
            
            if (isReload) {
                // Find your main iframe element
                const iframe = document.getElementById('main_frame');
                if (iframe) {
                    // Force the browser engine to flush out its memory cache layout by resetting the source
                    const currentSrc = iframe.src;
                    iframe.src = 'about:blank'; // Break the memory anchor
                    
                    // Reassign the clean URL back with a dynamic time string to force a full server fetch
                    setTimeout(() => {
                        const cacheBuster = new URL(currentSrc, window.location.href);
                        cacheBuster.searchParams.set('v', Date.now());
                        iframe.src = cacheBuster.toString();
                    }, 50);
                }
            }
        });
    </script>

</body>
</html>
