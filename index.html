<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Originals by Halena</title>

    <style>
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Stops mobile layouts from jumping during window flips */
        }
	
        /* 1. Outer viewport window wrapper that centers our graphic artwork structure */
        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
            
            /* Thinner, clean grey border edge buffer layout zone */
            padding: 8px; 
            box-sizing: border-box; 
        }

        /* 2. THE CANVAS: Dynamically maps the dimensions of whichever image is loading */
        .artwork-canvas {
            position: relative;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        /* 3. The true background graphic player engine setup */
        .canvas-bg-img {
            position: relative; 
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            z-index: 1;
            
            /* DEFAULT NARROW ARTWORK FOR MOBILE PORTRAIT */
            content: url('main_background_narrow.png');
        }

        /* BULLETPROOF SYNCHRONIZED BREAKPOINT SWAP
           Swaps the image source file inside CSS at the exact instant the layout metrics shift */
        @media (min-width: 901px), screen and (orientation: landscape) {
            .canvas-bg-img {
                content: url('main_background_wide.png');
            }
        }

        /* ========================================================
           COORDINATE GRID TUNING KEYS
           All percentages below track the raw image bounds natively
           ======================================================== */

        /* 1. DEFAULT MOBILE NARROW VIEW (Portrait Phone) */
        #dropdown-anchor {
            position: absolute;
            z-index: 20;   
            container-type: inline-size; 
            transform: translate(-50%, -50%);
            
            /* FIXED: Reconfigured to stay clearly in view over your portrait asset block */
            top: 3.5%; 
            left: 13.25%;
            width: 26%;  
            height: 5%; 
            white-space: nowrap; 
        }

        .iframe-container {
            position: absolute;
            z-index: 10; 
            transform: translate(-50%, -50%);
            left: 50%;
            
            /* FIXED: Maximized to consume all 4 directions and balanced the slight vertical offset up */
            top: 53.5%;          
            width: 98%;        
            height: 84%;       
        }

        /* 2. MOBILE LANDSCAPE OVERRIDE (Phones rotated sideways only)
           Triggers if screen is landscape BUT narrow (under 900px wide) */
        @media screen and (orientation: landscape) and (max-width: 900px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 6.5%;  
                top: 10.5%;   
                width: 32%;   
                height: 6%; 
            }

            .iframe-container {
                top: 51.5%;        
                width: 92%;        
                height: 58%;       
            }
        }

        /* 3. TRUE DESKTOP VIEW OVERRIDE (Large monitors & tablets)
           Triggers if the screen is wider than 901px regardless of orientation */
        @media screen and (min-width: 901px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 5.5%;  
                top: 10.5%;    
                width: 30%;   
                height: 6%; 
            }

            .iframe-container {
                /* FIXED: Lifted slightly from 49.5% to 48.5% to clear the bottom image overlap */
                top: 48.5%;        
                width: 90%;        
                height: 69%;       
            }
        }

        /* Reset inner frame systems */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none; 
            background: transparent; 
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- The Balanced Coordinate Canvas Container Block -->
        <div class="artwork-canvas">
            
            <!-- Background element graphic loads its responsive files using pure CSS rules now -->
            <img id="bg-image-element" class="canvas-bg-img" alt="Background">

            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
            
        </div>

    </div>

    <!-- Dropdown Core Engine Script Link -->
    <script src="./image_dropdown.js"></script>
    
    <script>
        // Responsive resizing code is offloaded to the CSS layout engine to prevent lag shifts
        window.addEventListener('DOMContentLoaded', () => {
            // Your dropdown link index menu settings matrix
            const pageMenuConfig = [
                { title: "About Me",  filename: "./about_me.html" },
                { title: "Pet Portraits", filename: "./pet_portraits.html" },
                { title: "Ink Drawings",  filename: "./ink_drawings.html" }
            ];

            // Instantiate your background dropdown navigation element
            new ImageDropdown('dropdown-anchor', 'main_frame', pageMenuConfig, 'Choose a Page...',  0, 0 );
        });
    </script>

</body>
</html>
