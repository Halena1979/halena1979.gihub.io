<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Originals by Halena</title>

    <style>
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Stops mobile layouts from jumping during window flips */
        }
	
        /* 1. This wrapper fills the screen, introduces a 50px padding margin, and centers our canvas */
        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
            
            /* FIX: Expanded from 30px to 50px to make the grey frame around your art look thicker */
            padding: 50px; 
            box-sizing: border-box; 
        }

        /* 2. THE CANVAS: Constrained perfectly using max-bounds to prevent distortion */
        .artwork-canvas {
            position: relative;
            
            /* Using 100% bounds allows absolute child containers to resolve widths correctly on mobile */
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            
            /* DEFAULT NARROW ASPECT: Forces the parent container to map your mobile shape */
            aspect-ratio: 1080 / 1920; 
            display: block;
        }

        /* 3. The true background element image layer */
        .canvas-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Object-fit contain forces the inner image to scale natively without squishing */
            object-fit: contain; 
            z-index: 1;
        }

        /* 4. WIDESCREEN ASPECT FLIP: Changes the container shape when screen is wide or turned landscape */
        @media (min-width: 901px), screen and (orientation: landscape) {
            .artwork-canvas {
                aspect-ratio: 1920 / 1080; /* Flips the container box to match your wide image */
            }
        }

        /* ========================================================
           COORDINATE GRID TUNING KEYS
           All percentages below track the raw image bounds natively
           ======================================================== */

        /* 1. DEFAULT MOBILE NARROW VIEW */
        #dropdown-anchor {
            position: absolute;
            z-index: 20;   
            container-type: inline-size; 
            transform: translate(-50%, -50%);
            
            top: 3.5%; 
            left: 13.25%;
            width: 26%;  
            height: 5%; 
            
            /* Safeguards text from wrapping inside absolute layout boxes */
            white-space: nowrap; 
        }

        .iframe-container {
            position: absolute;
            z-index: 10; 
            transform: translate(-50%, -50%);
            left: 50%;
            
            /* --- FINAL MAXIMUM TUNING: MOBILE PORTRAIT NARROW IFRAME --- */
            top: 48%;          
            width: 98%;        
            height: 84%;       
        }

        /* 2. MOBILE LANDSCAPE OVERRIDE (Phones rotated sideways only)
           Triggers if screen is landscape BUT narrow (under 900px wide) */
        @media screen and (orientation: landscape) and (max-width: 900px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 6.5%;  
                top: 10.5%;   
                width: 32%;   
                height: 6%; 
            }

            .iframe-container {
                /* --- FINAL MAXIMUM TUNING: MOBILE LANDSCAPE WIDE IFRAME --- */
                top: 51.5%;        
                width: 92%;        
                height: 58%;       
            }
        }

        /* 3. TRUE DESKTOP VIEW OVERRIDE (Large monitors & tablets)
           Triggers if the screen is wider than 901px regardless of orientation */
        @media screen and (min-width: 901px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 5.5%;  
                top: 10.5%;    
                width: 30%;   
                height: 6%; 
            }

            .iframe-container {
                /* --- FINAL MAXIMUM TUNING: DESKTOP WIDESCREEN IFRAME --- */
                top: 49.5%;        
                width: 90%;        
                height: 69%;       
            }
        }

        /* Reset inner frame systems */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none; 
            background: transparent; 
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- The Locked Aspect Canvas Box -->
        <div class="artwork-canvas">
            
            <!-- Dynamic img tag handles rendering natively across all viewports -->
            <img id="bg-image-element" src="main_background_narrow.png" class="canvas-bg-img" alt="Background">

            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
            
        </div>

    </div>

    <!-- Dropdown Core Engine Script Link -->
    <script src="./image_dropdown.js"></script>
    
    <script>
        function updateResponsiveImageSource() {
            const imgElement = document.getElementById('bg-image-element');
            if (!imgElement) return;

            const isWidescreen = window.innerWidth >= 901 || window.matchMedia("(orientation: landscape)").matches;
            const targetSrc = isWidescreen ? "main_background_wide.png" : "main_background_narrow.png";

            if (!imgElement.src.includes(targetSrc)) {
                imgElement.src = targetSrc;
            }
        }

        window.addEventListener('resize', updateResponsiveImageSource);
        window.addEventListener('DOMContentLoaded', () => {
            updateResponsiveImageSource();

            const pageMenuConfig = [
                { title: "About Me",  filename: "./about_me.html" },
                { title: "Pet Portraits", filename: "./pet_portraits.html" },
                { title: "Ink Drawings",  filename: "./ink_drawings.html" }
            ];

            new ImageDropdown('dropdown-anchor', 'main_frame', pageMenuConfig, 'Choose a Page...',  0, 0 );
        });
    </script>

</body>
</html>
