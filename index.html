<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Originals by Halena</title>

    <style>
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Stops mobile layouts from jumping during window flips */
        }
	
        /* 1. Outer viewport window wrapper that centers our graphic artwork structure */
        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
            
            /* Thicker grey padding frame edge buffer zone */
            padding: 50px; 
            box-sizing: border-box; 
        }

        /* 2. THE CANVAS: Inherits dimensions natively from the active image file down below */
        .artwork-canvas {
            position: relative;
            display: block;
            
            /* Max limits keep the container scale contained safely inside the 50px grey padding boundaries */
            max-width: 100%;
            max-height: 100%;
        }

        /* 3. The true background graphic player engine setup */
        .canvas-bg-img {
            /* FIX: Changing to relative forces the parent container to automatically map its exact size */
            position: relative; 
            display: block;
            
            /* Fluidly fills limits without stretching out of proportion */
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            z-index: 1;
        }

        /* ========================================================
           COORDINATE GRID TUNING KEYS
           All percentages below track the raw image bounds natively
           ======================================================== */

        /* 1. DEFAULT MOBILE NARROW VIEW */
        #dropdown-anchor {
            position: absolute;
            z-index: 20;   
            container-type: inline-size; 
            transform: translate(-50%, -50%);
            
            top: 3.5%; 
            left: 13.25%;
            width: 26%;  
            height: 5%; 
            white-space: nowrap; 
        }

        .iframe-container {
            position: absolute;
            z-index: 10; 
            transform: translate(-50%, -50%);
            left: 50%;
            
            top: 48%;          
            width: 98%;        
            height: 84%;       
        }

        /* 2. MOBILE LANDSCAPE OVERRIDE (Phones rotated sideways only)
           Triggers if screen is landscape BUT narrow (under 900px wide) */
        @media screen and (orientation: landscape) and (max-width: 900px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 6.5%;  
                top: 10.5%;   
                width: 32%;   
                height: 6%; 
            }

            .iframe-container {
                top: 51.5%;        
                width: 92%;        
                height: 58%;       
            }
        }

        /* 3. TRUE DESKTOP VIEW OVERRIDE (Large monitors & tablets)
           Triggers if the screen is wider than 901px regardless of orientation */
        @media screen and (min-width: 901px) {
            #dropdown-anchor {
                background-image: none !important; 
                left: 5.5%;  
                top: 10.5%;    
                width: 30%;   
                height: 6%; 
            }

            .iframe-container {
                top: 49.5%;        
                width: 90%;        
                height: 69%;       
            }
        }

        /* Reset inner frame systems */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none; 
            background: transparent; 
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- The Balanced Coordinate Canvas Container Block -->
        <div class="artwork-canvas">
            
            <!-- Dynamic img tag establishes visual scale constraints natively -->
            <img id="bg-image-element" src="main_background_narrow.png" class="canvas-bg-img" alt="Background">

            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
            
        </div>

    </div>

    <!-- Dropdown Core Engine Script Link -->
    <script src="./image_dropdown.js"></script>
    
    <script>
        function updateResponsiveImageSource() {
            const imgElement = document.getElementById('bg-image-element');
            if (!imgElement) return;

            const isWidescreen = window.innerWidth >= 901 || window.matchMedia("(orientation: landscape)").matches;
            const targetSrc = isWidescreen ? "main_background_wide.png" : "main_background_narrow.png";

            if (!imgElement.src.includes(targetSrc)) {
                imgElement.src = targetSrc;
            }
        }

        window.addEventListener('resize', updateResponsiveImageSource);
        window.addEventListener('DOMContentLoaded', () => {
            updateResponsiveImageSource();

            const pageMenuConfig = [
                { title: "About Me",  filename: "./about_me.html" },
                { title: "Pet Portraits", filename: "./pet_portraits.html" },
                { title: "Ink Drawings",  filename: "./ink_drawings.html" }
            ];

            new ImageDropdown('dropdown-anchor', 'main_frame', pageMenuConfig, 'Choose a Page...',  0, 0 );
        });
    </script>

</body>
</html>
