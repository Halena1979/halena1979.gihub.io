<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Originals by Halena</title>

    <style>
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Prevents scrollbars when rotating mobile screens */
        }
	
        /* 1. This outer wrapper fills the screen and keeps the inner artwork perfectly centered */
        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
        }

        /* 2. NEW FIXED BOUNDARY LAYER: This box matches your narrow image aspect ratio perfectly */
        .artwork-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            aspect-ratio: 1080 / 1920; /* Matches your mobile narrow graphic proportions */
            
            background-image: url('main_background_narrow.png'); 
            background-size: contain;      
            background-position: center;  
            background-repeat: no-repeat;
            background-color: transparent;
        }

        /* 3. DESKTOP VIEW CHANGES: Flips aspect ratio and background image when screen gets wide */
        @media (min-width: 768px), screen and (orientation: landscape) {
            .artwork-canvas {
                aspect-ratio: 1920 / 1080; /* Matches your desktop wide graphic proportions */
                background-image: url('main_background_wide.png'); 
                background-size: contain; 
                background-position: center;
                background-repeat: no-repeat;
            }
        }

        /* All absolute elements below are now locked strictly to the image edges instead of the screen monitor */

        #dropdown-anchor {
            position: absolute;
            z-index: 20;   
            container-type: inline-size; 
            transform: translate(-50%, -50%);
            
            /* ADJUST THESE FOR MOBILE: Placement of the black rectangle */
            top: 4.0%;          /* Vertical position from the top edge */
            left: 12.75%;       /* Horizontal position from the left edge */
            width: 26%;        /* Width of the menu bounding box */
            height: 5%;        /* Height of the menu bounding box */
        }

.iframe-container {
    position: absolute;
    z-index: 10; 
    overflow: hidden;
    border: none;
    outline: none;
    background: transparent; 
    transform: translate(-50%, -50%);
    left: 50%;         /* Keeps the frame horizontally centered */
    
    /* ADJUST THESE FOR MOBILE: Proportions of your whitespace box */
    top: 53%;          /* Vertical position of the iframe's center point */
    width: 60%;        /* Width of the iframe box */
    height: 65%;       /* Height of the iframe box (lower this if it leaks out the bottom) */
}

.iframe-container iframe {
    width: 100%;
    height: 100%;
    border: none; 
    background: transparent; 
}


/* ==========================================
   2. DESKTOP CONFIGURATION (Widescreen)
   Adjust these values for your "_wide" image 
   ========================================== */

@media (min-width: 768px), screen and (orientation: landscape) {
    .artwork-canvas {
        aspect-ratio: 1920 / 1080; 
        background-image: url('main_background_wide.png'); 
        background-size: contain; 
        background-position: center;
        background-repeat: no-repeat;
    }

    /* OVERRIDE COORDINATES SPECIFICALLY FOR THE DESKTOP GRAPHIC */
    #dropdown-anchor {
        /* Tweak these until it lands dead-center over the wide image's black rectangle */
        top: 9.75%;      /* Change this percentage to move it up or down on desktop */
        left: 9.0%;     /* Change this percentage to move it left or right on desktop */
        width: 22%;    /* Desktop width mapping adjustments */
        height: 6%;    /* Desktop height mapping adjustments */
    }

    .iframe-container {
        /* Tweak these until it cleanly sits inside the wide image's whitespace box */
        top: 55%;      /* Vertical center point on desktop */
        width: 55%;    /* Shrink this percentage if it bleeds left/right on desktop */
        height: 58%;   /* LOWER THIS PERCENTAGE if your iframe text overlaps the image bottom */
    }
}
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- FIX: This wrapper captures your elements and locks them to the background scaling coordinates -->
        <div class="artwork-canvas">
            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
        </div>

    </div>

    <script src="./image_dropdown.js"></script>
    
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const pageMenuConfig = [
                { title: "About Me",  filename: "./about_me.html" },
                { title: "Pet Portraits", filename: "./pet_portraits.html" },
                { title: "Ink Drawings",  filename: "./ink_drawings.html" }
            ];

            new ImageDropdown('dropdown-anchor', 'main_frame', pageMenuConfig, 'Choose a Page...',  0, 0 );
        });
    </script>

</body>
</html>
