<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Originals by Halena</title>

    <style>
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Stops mobile layouts from jumping during window flips */
        }
	
        /* 1. The outer screen frame centers our locked canvas box in the window */
        .page-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
        }

        /* 2. THE FIX: A structural element that mimics your graphic canvas perfectly */
        .artwork-canvas {
            position: relative;
            /* Scale fluidly until it hits the max boundaries of the user screen */
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
            
            /* DEFAULT NARROW ASPECT: Forces the parent container to map your mobile shape */
            aspect-ratio: 1080 / 1920; 
            display: block;
        }

        /* 3. The true background element tags layer */
        .canvas-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* Fills our locked aspect box perfectly */
            z-index: 1;
        }

        /* 4. WIDESCREEN ASPECT FLIP: Changes the container shape when screen is wide */
        @media (min-width: 768px), screen and (orientation: landscape) {
            .artwork-canvas {
                aspect-ratio: 1920 / 1080; /* Flips the container box to match your wide image */
            }
        }

        /* ========================================================
           COORDINATE GRID TUNING KEYS
           All percentages below track the raw image bounds natively
           ======================================================== */

        /* Mobile Narrow Layout Placements */
        #dropdown-anchor {
            position: absolute;
            z-index: 20;   
            container-type: inline-size; 
            transform: translate(-50%, -50%);
            
            /* Tweak these for Mobile Narrow */
            top: 3.5%; 
            left: 13.25%;
            width: 26%;  
            height: 5%; 
        }

        .iframe-container {
            position: absolute;
            z-index: 10; 
            transform: translate(-50%, -50%);
            left: 50%;
            
            /* Tweak these for Mobile Narrow */
            top: 53%;
            width: 60%; 
            height: 65%; /* Lower this percentage if the iframe leaks out the bottom on mobile */
        }

        /* Desktop Widescreen Layout Placements Override */
        @media (min-width: 768px), screen and (orientation: landscape) {
            #dropdown-anchor {
                /* Tweak these for Desktop Wide */
                top: 9.2%;     /* Lower percentage moves it UP, higher moves it DOWN */
                left: 6%;    /* Lower percentage moves it LEFT, higher moves it RIGHT */
                width: 22%;   /* Width of clickable dropdown container box */
                height: 6%; 
            }

            .iframe-container {
                /* Tweak these for Desktop Wide */
                top: 55%;     /* Vertical center placement */
                width: 55%;   /* Width of iframe canvas view window */
                height: 55%;  /* LOWER THIS if frame page text overlaps your image bottom graphics */
            }
        }

        /* Reset inner frame systems */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none; 
            background: transparent; 
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- The Locked Aspect Canvas Block -->
        <div class="artwork-canvas">
            
            <!-- Dynamic img tag replaces the old broken CSS background layout rules -->
            <img id="bg-image-element" src="main_background_narrow.png" class="canvas-bg-img" alt="Background">

            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
            
        </div>

    </div>

    <script src="./image_dropdown.js"></script>
    
    <script>
        // Automatic Image Source Engine Switcher
        function updateResponsiveImageSource() {
            const imgElement = document.getElementById('bg-image-element');
            if (!imgElement) return;

            const isWidescreen = window.innerWidth >= 768 || window.matchMedia("(orientation: landscape)").matches;
            const targetSrc = isWidescreen ? "main_background_wide.png" : "main_background_narrow.png";

            // Swap source only if necessary to save performance rendering loops
            if (!imgElement.src.includes(targetSrc)) {
                imgElement.src = targetSrc;
            }
        }

        // Initialize background orientation monitors
        window.addEventListener('resize', updateResponsiveImageSource);
        window.addEventListener('DOMContentLoaded', () => {
            updateResponsiveImageSource();

            const pageMenuConfig = [
                { title: "About Me",  filename: "./about_me.html" },
                { title: "Pet Portraits", filename: "./pet_portraits.html" },
                { title: "Ink Drawings",  filename: "./ink_drawings.html" }
            ];

            new ImageDropdown('dropdown-anchor', 'main_frame', pageMenuConfig, 'Choose a Page...',  0, 0 );
        });
    </script>

</body>
</html>
