<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Originals by Halena</title>

    <style>
        html, body {
            background-color: #D1D1D1;
            margin: 0;
            padding: 0;
            height: 100%; 
            width: 100%;
            overflow: hidden; /* Stops mobile layouts from jumping during window flips */
        }
	
        /* 1. Outer viewport window wrapper that centers our graphic artwork structure */
        .page-wrapper {
            position: relative; 
            width: 100vw;
            height: 100vh;
            height: 100dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #D1D1D1;
            
            /* Thinner, clean grey border edge buffer layout zone */
            padding: 8px; 
            box-sizing: border-box; 
        }

        /* 2. THE CANVAS: Dynamically maps the dimensions of whichever image is loading */
        .artwork-canvas {
            position: relative; 
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        /* 3. The true background graphic player engine setup */
        .canvas-bg-img {
            position: relative; 
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            z-index: 1;
            
            /* DEFAULT NARROW ARTWORK FOR MOBILE PORTRAIT */
            content: url('main_background_narrow.png');
        }

        /* BULLETPROOF SYNCHRONIZED BREAKPOINT SWAP */
        @media (min-width: 901px), screen and (orientation: landscape) {
            .canvas-bg-img {
                content: url('main_background_wide.png');
            }
        }

        /* ========================================================
           COORDINATE GRID PLACEMENT BOXES
           We now pass percentages directly to the JavaScript class
           ======================================================== */

        #dropdown-anchor {
            position: absolute;
            z-index: 20;   
            transform: translate(-50%, -50%);
            
            /* DEFAULT MOBILE NARROW VALUES */
            top: 11.5%; 
            left: 21.5%;
            width: 26%;  
            height: 5%; 
        }

        .iframe-container {
            position: absolute;
            z-index: 10; 
            transform: translate(-50%, -50%);
            left: 50%;
            
            /* Aligned to clear the bottom border line cleanly */
            top: 48.5%;          
            width: 98%;        
            height: 84%;       
        }

        /* MOBILE LANDSCAPE OVERRIDE (Phones rotated sideways only) */
        @media screen and (orientation: landscape) and (max-width: 900px) {
            #dropdown-anchor {
                left: 15.5%;  
                top: 11.5%;   
                width: 32%;   
                height: 6%; 
            }
            .iframe-container {
                top: 51.5%;        
                width: 92%;        
                height: 58%;       
            }
        }

        /* TRUE DESKTOP VIEW OVERRIDE (Large monitors & tablets) */
        @media screen and (min-width: 901px) {
            #dropdown-anchor {
                left: 13.5%;  
                top: 10.5%;    
                width: 30%;   
                height: 6%; 
            }
            .iframe-container {
                top: 48.5%;        
                width: 90%;        
                height: 69%;       
            }
        }

        /* Reset inner frame systems */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none; 
            background: transparent; 
        }

        /* Force option menu items styling to drop down cleanly beneath overlay layer */
        #dropdown-anchor select option {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-weight: normal !important;
        }
    </style>
</head>
<body>

    <div class="page-wrapper" id="page-wrapper1">
        
        <!-- The Balanced Coordinate Canvas Container Box -->
        <div class="artwork-canvas">
            
            <!-- Background element graphic loads its responsive files using pure CSS rules now -->
            <img id="bg-image-element" class="canvas-bg-img" alt="Background">

            <div id="dropdown-anchor"></div>
      
            <div class="iframe-container">
                <iframe src="welcome_video.html" name="content-frame" id="main_frame"></iframe>
            </div>
            
        </div>

    </div>

    <!-- Dropdown Core Engine Script Link -->
    <script src="./image_dropdown.js"></script>
    
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const pageMenuConfig = [
                { title: "About Me",  filename: "./about_me.html" },
                { title: "Pet Portraits", filename: "./pet_portraits.html" },
                { title: "Ink Drawings",  filename: "./ink_drawings.html" }
            ];

            // FIXED INITIALIZATION: 
            // By keeping the anchor box positioned precisely using CSS percentages above, 
            // we pass 0, 0 offsets here to let the script center its overlay layers perfectly inside it.
            new ImageDropdown('dropdown-anchor', 'main_frame', pageMenuConfig, 'Choose a Page...',  0, 0 );
        });
    </script>

</body>
</html>
