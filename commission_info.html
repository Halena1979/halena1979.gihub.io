<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Commission info</title>
    <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        background-color: #D1D1D1;
        
        /* Centering the entire frame context */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .image-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        padding: 20px; /* Optional safety padding around the image */
    }

    #page-img {max-width:100%;
               max-height:100%;}
    </style>
</head>
<body>
    <div class = "image-wrapper">
    <img id="page-img" src="./commission_info.png"/>
    </div>
</body>
</html>
