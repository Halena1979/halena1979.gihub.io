<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        overflow-y:auto;
        background-color: #D1D1D1;
        
        /* Centering the entire frame context */
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .contact-container {
            width:  min(85%, 650px); /* Makes the entire form wider */
            margin: auto;
            padding: clamp(10px, 3vh, 30px) clamp(15px, 4vw, 30px);
            font-family: 'Montserrat';
            font-size: clamp(13px, 2.2vh, 18px); 
            background: transparent;
        }

    .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: clamp(8px, 2vh, 20px);
        }
    
    .form-group label {
            margin-bottom: 4px;
            font-size: inherit; 
    }

    .form-group input {
         width: 100%;
        max-width: 400px;
        padding: clamp(6px, 1.2vh, 10px);
        border: none;
        border-radius: 4px;
        font-size: inherit;

    }

    #submit-btn {
          padding: clamp(8px, 1.4vh, 12px) 20px;
        font-size: inherit;
        cursor: pointer;  
    }

    .form-group textarea {
            width: 100%;
        /* Scales height smoothly based on the iframe's available height */
        height: clamp(70px, 22vh, 200px); 
        padding: clamp(8px, 1.5vh, 12px);
        border: none;
        border-radius: 6px;
        font-size: inherit;
        color: #333333;
        background-color: #f8fafc;
        resize: vertical;
        transition: all 0.2s ease-in-out;
        }

    #message_header {font-size: clamp(15px, 2.6vh, 24px);
        margin-bottom: clamp(10px, 2.5vh, 24px);
        line-height: 1.3; }

</style>
</head>
<body>
    <div class="contact-container">
        <div id="message_header" >
        Drop me a line with your thoughts,<br>
        and let's make something beautiful!<br><br></div>
        
        <form id="contact-form" method="POST">
            <!-- Spam Protection: HoneyPot Field -->
            <input type="text" name="_honey" style="display:none">

            <input type="hidden" name="_captcha" value="false"> 
            <input type="hidden" name="_subject" value="OriginalsByHalena - New Note">

            <div  class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required placeholder="Type your message here..."></textarea>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
        </form>

        <p id="form-status" style="display:none; color: green; font-weight: bold; margin-top: 15px;">
            Thank you! Your message has been sent successfully.
        </p>

        <br>
        
    </div>

    <script>
        const myEmail = "halenafisher@gmail.com";

        // 🛠️ TOGGLE THIS VARIABLE:
        // Set to true for your very first submission to get the email activation link.
        // Change to false right after activating, then push your code back to GitHub.
        const firstTimeActivation = false; 

        const form = document.getElementById('contact-form');
        const button = document.getElementById('submit-btn');
        const status = document.getElementById('form-status');

        // Configure the URL route globally based on your toggle
        if (firstTimeActivation) {
            form.action = "https://formsubmit.co/" + myEmail;
        } else {
            form.action = "https://formsubmit.co/ajax/" + myEmail;
        }

        form.addEventListener('submit', function(event) {
            // If we are in activation mode, do not run the AJAX intercept script.
            // Let the browser redirect normally so FormSubmit can send you the confirmation email.
            if (firstTimeActivation) {
                return; 
            }

            // --- PRODUCTION SILENT SUBMISSION (Runs when firstTimeActivation is false) ---
            event.preventDefault(); 
            
            button.textContent = "Sending...";
            button.disabled = true;

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    status.style.display = "block"; 
                    form.reset(); 
                } else {
                    alert("Oops! There was a problem submitting your form");
                }
                button.textContent = "Send Message";
                button.disabled = false;
            })
            .catch(error => {
                alert("Oops! There was a network error connection problem.");
                button.textContent = "Send Message";
                button.disabled = false;
            });
        });
    </script>
</body>
</html>
