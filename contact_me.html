<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
        background-color: #D1D1D1;
        
        /* Centering the entire frame context */
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contact-container {
            width: 70%; /* Makes the entire form wider */
            margin: 40px auto;
            padding: 30px;
            font-family: 'Montserrat';
            font-size: clamp(14px, 2.2cqi, 20px); 
            background: transparent;
        }

    .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
    
    .form-group label {
            font-size: clamp(14px, 2.2cqi, 20px); 
    }

    .form-group input {
        width: 70%;
        border: None;
        font-size: clamp(14px, 2.2cqi, 20px); 

    }

    #submit-btn {
          font-size: clamp(14px, 2.2cqi, 20px);   
    }

    .form-group textarea {
            width: 100%; /* Spans the entire width of the form container */
            height: 75%;
            padding: 12px;
            border: None;
            border-radius: 6px;
            font-size: clamp(14px, 2.2cqi, 20px); 
            color: #333333;
            background-color: #f8fafc;
            box-sizing: border-box; /* Ensures padding doesn't break full-width */
            transition: all 0.2s ease-in-out;
        }

    #message_header {width:100%;}

</style>
</head>
<body>
    <div class="contact-container">
        <img id="message_header" src="./message_header.png"/>
        
        <form id="contact-form" method="POST">
            <!-- Spam Protection: HoneyPot Field -->
            <input type="text" name="_honey" style="display:none">

            <input type="hidden" name="_captcha" value="false"> 
            <input type="hidden" name="_subject" value="OriginalsByHalena - New Note">

            <div  class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="10" required placeholder="Type your message here..."></textarea>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
        </form>

        <p id="form-status" style="display:none; color: green; font-weight: bold; margin-top: 15px;">
            Thank you! Your message has been sent successfully.
        </p>

        <br>
        
    </div>

    <script>
        const myEmail = "halenafisher@gmail.com";

        // 🛠️ TOGGLE THIS VARIABLE:
        // Set to true for your very first submission to get the email activation link.
        // Change to false right after activating, then push your code back to GitHub.
        const firstTimeActivation = false; 

        const form = document.getElementById('contact-form');
        const button = document.getElementById('submit-btn');
        const status = document.getElementById('form-status');

        // Configure the URL route globally based on your toggle
        if (firstTimeActivation) {
            form.action = "https://formsubmit.co/" + myEmail;
        } else {
            form.action = "https://formsubmit.co/ajax/" + myEmail;
        }

        form.addEventListener('submit', function(event) {
            // If we are in activation mode, do not run the AJAX intercept script.
            // Let the browser redirect normally so FormSubmit can send you the confirmation email.
            if (firstTimeActivation) {
                return; 
            }

            // --- PRODUCTION SILENT SUBMISSION (Runs when firstTimeActivation is false) ---
            event.preventDefault(); 
            
            button.textContent = "Sending...";
            button.disabled = true;

            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    status.style.display = "block"; 
                    form.reset(); 
                } else {
                    alert("Oops! There was a problem submitting your form");
                }
                button.textContent = "Send Message";
                button.disabled = false;
            })
            .catch(error => {
                alert("Oops! There was a network error connection problem.");
                button.textContent = "Send Message";
                button.disabled = false;
            });
        });
    </script>
</body>
</html>
